# Evaluation set for the Samsung manual RAG system.
#
# Rebuilt 2026-09-07 against the real corpus: SM-A055F_UG_EU_Eng_Rev1.0_250507.pdf,
# 32 pages, 76 chunks. The previous set was written for the deleted 28-manual
# corpus and asked about battery, charging, screenshots and always-on display —
# none of which appear anywhere in these 32 pages. It was replaced wholesale
# rather than repaired.
#
# What this corpus actually covers: Gallery, Multi window, Samsung Internet,
# Notes, Kids, Calendar, Reminder, Radio, Voice Recorder, My Files, Clock,
# Calculator, Gaming Hub, SmartThings, sharing, Google apps, and the Settings
# chapters for Connections (Wi-Fi, Bluetooth, NFC, data, hotspot, printing),
# Connected devices, Modes and Routines, and Sounds and vibration.
#
# Gold labels are `expect` — substrings that must appear in the section path or
# body of at least one retrieved chunk. Section paths are used rather than chunk
# ids because ids change on every re-index, and a question's *right answer* does
# not. `expect_text` optionally requires a phrase in the chunk body, for
# questions where the section alone is too coarse. Note the asymmetry: `expect`
# is matched against path + body, `expect_text` against the body only, so an
# `expect_text` term that appears solely in a section title will never match.
#
# This manual has no PDF outline, so section paths are flat — there is no
# `chapter > section` ancestry to match against, and two sections are both
# called "Options" (Connections on p21, Sounds and vibration on p31). Labels
# for those must lean on `expect_text`.
#
# Types:
#   factual     — one fact, stated in one place
#   procedural  — a sequence of steps
#   spec        — a named option, value, or list of choices
#   unanswerable — deliberately outside the manual; the system must refuse
#
# Questions are phrased the way a user would ask, NOT the way the manual writes
# it. Copying the manual's wording would flatter BM25 and make the ablation
# meaningless. Where a question has to name a feature the user would plausibly
# already know the name of (Bluetooth, Wi-Fi, NFC), the surrounding phrasing is
# still the user's, not the manual's.

