# --- verbatim-string questions ---
# These are the case BM25 uniquely wins: exact tokens a dense model blurs
# together, since "IP68" and "IP67" are near-identical in embedding space.
# Every string below was verified to exist in the corpus before being used.

- id: verbatim-ip68
  type: spec
  question: IP68
  expect: ["water and dust", "package contents"]
  expect_text: ["IP68"]

