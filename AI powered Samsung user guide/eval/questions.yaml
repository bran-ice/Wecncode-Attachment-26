# Evaluation set for the Samsung manual RAG system.
#
# Gold labels are `expect` — substrings that must appear in the section path of
# at least one retrieved chunk. Section paths are used rather than chunk ids
# because ids change on every re-index, and a question's *right answer* does
# not. `expect_text` optionally requires a phrase in the chunk body, for
# questions where the section alone is too coarse.
#
# Types:
#   factual     — one fact, stated in one place
#   procedural  — a sequence of steps
#   spec        — a table or a specific value/name
#   unanswerable — deliberately outside the manuals; the system must refuse
#
# Questions are phrased the way a user would ask, NOT the way the manual writes
# it. Copying the manual's wording would flatter BM25 and make the ablation
# meaningless.

- id: aod-enable
  type: procedural
  question: how do I keep the clock showing when the screen is off
  expect: ["Lock screen", "AOD"]

- id: screenshot
  type: procedural
  question: what buttons do I press to take a screenshot
  expect: ["Screen capture", "screenshot"]

- id: overheat-charging
  type: factual
